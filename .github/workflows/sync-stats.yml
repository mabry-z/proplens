name: Sync NFL stats

on:
  schedule:
    - cron: "30 9 * * *"   # every day, 09:30 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - name: Load schedules, game logs and injuries from nflverse
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_stats.py
